services:
  - type: web
    name: marketpredict-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt -r requirements-ml.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        sync: false        # se define en el panel de Render
      - key: DATABASE_URL
        sync: false        # cadena de conexión de Supabase (pooler)
      - key: USE_DEMO
        value: "false"
      - key: ENABLE_TS_MODELS
        value: "false"     # ARIMA/SARIMA: cambie a "true" tras verificar tiempos en Render
