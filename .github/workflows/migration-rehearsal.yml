name: Migration rehearsal

# Rehearses the production upgrade (20261117 -> head) on a disposable PostgreSQL 17 server.
# No secrets and no connection to production: the production state is rebuilt from git history and
# checked against a schema fingerprint taken read-only from Supabase.
on:
  workflow_dispatch:
  push:
    branches: [fix/enterprise-sprint5-queue-locks]
    paths:
      - migrations/**
      - app/models/**
      - scripts/migration_rehearsal.py
      - scripts/schema_fingerprint.sql
      - .github/workflows/migration-rehearsal.yml

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REHEARSAL_ADMIN_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/postgres
      PROD_PATH: /tmp/prod-5da6fe0
      S4_PATH: /tmp/sprint4-a0d691b
      REHEARSAL_OUT: /tmp/rehearsal
      # Read-only fingerprint of production (Supabase, PostgreSQL 17.11), 2026-11-17.
      EXPECTED_PRODUCTION: >-
        {"n": 530, "total": "9a1a40787fb3a4706841809057aaee43",
        "enterprise": "b28cd1a8a52c2333945137d430839d49", "base": "fd8f841a010f317786563bc80c4b64aa"}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-test.txt
      - run: |
          git worktree add "$PROD_PATH" 5da6fe037b90be4c06726fcb4d982dc56dd5dcbc
          git worktree add "$S4_PATH" a0d691bad18765bc03c0b40d682f9e8fbf1085b0
      - run: python -m scripts.migration_rehearsal
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-rehearsal
          path: /tmp/rehearsal
