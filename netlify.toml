[build]
  publish = "app/static"

[[redirects]]
  from = "/api/*"
  to = "https://marketpredict1.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://marketpredict1.onrender.com/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/static/*"
  to = "https://marketpredict1.onrender.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "https://marketpredict1.onrender.com/:splat"
  status = 200
